<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egresos · Pro Salud Paz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Registrar Gasto / Egreso</h2>
    <form id="formEgreso">
        <div class="form-group">
            <label>Fecha del Gasto</label>
            <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
            <label>Concepto / Descripción</label>
            <input type="text" id="concepto" placeholder="Ej. Aceites, Luz, Toallas" required>
        </div>
        <div class="form-group">
            <label>Monto (S/.)</label>
            <input type="number" step="0.10" id="monto" placeholder="S/. 0.00" required>
        </div>
        <div class="form-group">
            <label>Método de Pago</label>
            <select id="metodo_pago" required>
                <option value="EFECTIVO">EFECTIVO</option>
                <option value="YAPE">YAPE</option>
            </select>
        </div>

        <button type="submit">Guardar Egreso</button>
    </form>
    <a href="menu.html" class="footer-link">⬅️ Volver al Menú</a>
</div>

<script src="config.js"></script>
<script>
    const sesion = verificarSesion(false);
    document.getElementById('fecha').value = new Date().toISOString().substring(0, 10);

    document.getElementById('formEgreso').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = "Guardando...";

        const payload = {
            action: 'guardarEgreso',
            fecha: document.getElementById('fecha').value,
            concepto: document.getElementById('concepto').value,
            monto: parseFloat(document.getElementById('monto').value),
            metodo_pago: document.getElementById('metodo_pago').value,
            usuario: sesion.usuario
        };

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            if(res.status === "success") {
                invalidarCacheGeneral(); // hay un egreso nuevo: refrescar datos en la próxima carga
                alert("Gasto guardado con éxito.");
                document.getElementById('formEgreso').reset();
                document.getElementById('fecha').value = new Date().toISOString().substring(0, 10);
            } else { alert("Error: " + res.message); }
        })
        .catch(err => alert("Error de red."))
        .finally(() => { btn.disabled = false; btn.textContent = "Guardar Egreso"; });
    });
</script>
</body>
</html>
